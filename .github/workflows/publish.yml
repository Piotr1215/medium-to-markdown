name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  build-and-test:
    uses: ./.github/workflows/build-reusable.yml

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Check version change and validity
        id: check_version
        run: ./check_version_change.sh

      - name: Get current package version
        if: steps.check_version.outcome == 'success'
        id: get_version
        run: echo "PACKAGE_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Generate Changelog
        if: steps.check_version.outcome == 'success'
        run: |
          if [ $(git tag -l | wc -l) -eq 0 ]; then
            echo "No previous tags found. Generating changelog for all commits."
            echo "## v${{ env.PACKAGE_VERSION }} - $(date +'%Y-%m-%d')" > CHANGELOG.md
            git log --pretty=format:"* %s (%h)" >> CHANGELOG.md
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0)
            echo "## v${{ env.PACKAGE_VERSION }} - $(date +'%Y-%m-%d')" > CHANGELOG.md
            git log $PREVIOUS_TAG..HEAD --pretty=format:"* %s (%h)" >> CHANGELOG.md
          fi

      - name: Publish to npm
        if: steps.check_version.outcome == 'success'
        run: npm publish --provenance --access public

      - name: Create Git Tag
        if: steps.check_version.outcome == 'success'
        run: |
          git tag "v${{ env.PACKAGE_VERSION }}"
          git push origin "v${{ env.PACKAGE_VERSION }}"

      - name: Create GitHub Release
        if: steps.check_version.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.PACKAGE_VERSION }}"
          name: "v${{ env.PACKAGE_VERSION }}"
          body_path: CHANGELOG.md
          files: |
            dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
